units:
  - name: manager_agent
    source_anchors:
      - .github/agents/fantasy-manager-agent.agent.md:1
    exported_signature: "fantasy request -> routed facts, evaluation, lineup, or opportunity response"
    depends_on: [collector, supporter, evaluator, coach, scout]
    dynamic_entrypoints: ["request-dependent routing", "optional scout invocation"]
    shared_refs: [report_identity]
  - name: collector
    source_anchors:
      - .github/skills/sleeper-nfl-data-collector/SKILL.md:13
    exported_signature: "subject, season?, week?, as_of?, format? -> sourced raw data package"
    depends_on: []
    dynamic_entrypoints: ["public Sleeper page availability", "client-rendered tabs"]
    shared_refs: []
  - name: supporter
    source_anchors:
      - .github/skills/fantasy-manager-supporter/SKILL.md:17
      - .github/skills/fantasy-manager-supporter-stats/SKILL.md:15
      - .github/skills/fantasy-manager-supporter-injuries/SKILL.md:13
      - .github/skills/fantasy-manager-supporter-team-analysis/SKILL.md:15
      - .github/skills/fantasy-manager-supporter-news/SKILL.md:13
    exported_signature: "subject, season?, week?, as_of?, report_dir? -> complete support report"
    depends_on: [collector]
    dynamic_entrypoints: ["independently callable specialty subskills"]
    shared_refs: [report_identity]
  - name: evaluator
    source_anchors:
      - .github/skills/fantasy-effectiveness-evaluator/SKILL.md:14
    exported_signature: "report, scoring?, horizon? -> evaluation with gate and confidence"
    depends_on: [supporter]
    dynamic_entrypoints: []
    shared_refs: [report_identity, injury_gate]
  - name: coach
    source_anchors:
      - .github/skills/fantasy-lineup-coordinator/SKILL.md:16
    exported_signature: "roster, slots, week, scoring?, as_of? -> lineup bundle"
    depends_on: [supporter, evaluator]
    dynamic_entrypoints: ["scout invocation on detected weakness"]
    shared_refs: [lineup_optimizer]
  - name: scout
    source_anchors:
      - .github/skills/fantasy-opportunity-scout/SKILL.md:14
    exported_signature: "roster, free_agents?, other_rosters?, mode?, week? -> opportunity report"
    depends_on: [supporter, evaluator]
    dynamic_entrypoints: []
    shared_refs: [report_identity]
  - name: runner
    source_anchors:
      - tools/run_week.py:1
      - tools/report_cache.py:1
    exported_signature: "JSON input + output directories -> validated JSON/Markdown artifacts"
    depends_on: [supporter, evaluator, coach]
    dynamic_entrypoints: ["CLI arguments", "report directory cleanup"]
    shared_refs: [report_identity, schema_validation, lineup_optimizer]
